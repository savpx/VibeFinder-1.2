# Netlify deployment configuration for the Vibe Finder static site.
# Static SPA assets (index.html, css/, js/, audio/) live in the repository root,
# so the publish directory is the root itself.

[build]
  publish = "."
  # Explicitly disable a build command: the bot is NOT a frontend build step.
  command = ""

# Never run the Telegram bot (bot.js) as part of CI build/deploy.
[build.environment]
  NETLIFY_USE_YARN = "false"

# SPA fallback: serve index.html for any path (hash routes like #/share/<slug>
# are handled client-side and never hit the server).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Extra safety: keep secret files out of the deployed bundle where possible.
[[headers]]
  for = "/.env"
  [headers.values]
    Cache-Control = "no-store"
